<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard Jumbara PMR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen p-6 font-sans transition-colors duration-300">

    <!-- HEADER DASHBOARD -->
    <header class="flex justify-between items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl mb-6 shadow-2xl transition-colors duration-300">
        <div class="flex items-center space-x-3">
            <img id="dashboardLogo" src="logo.png" alt="Logo Jumbara" class="h-12 w-auto object-contain">
            <div>
                <h1 class="text-xl font-black tracking-wide text-slate-900 dark:text-white">LIVE LEADERBOARD JUMBARA PMR MULA KE-4</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">PMI Kabupaten Purbalingga Tahun 2026</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right">
                <span class="text-xs text-slate-500 dark:text-slate-400 block">Status Sistem:</span>
                <span class="inline-flex items-center text-xs font-bold text-emerald-600 dark:text-emerald-400">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full mr-1.5 animate-ping"></span> Live Auto-Update (15s)
                </span>
            </div>
            <!-- TOMBOL TOGGLE THEME -->
            <button onclick="toggleTheme()" id="themeToggleBtn" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all shadow-sm" title="Ubah Tema">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- KARTU JUARA UMUM (3 BESAR) -->
        <div class="lg:col-span-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-xl space-y-4 transition-colors duration-300">
            <h2 class="text-base font-black text-amber-600 dark:text-amber-400 flex items-center border-b border-slate-200 dark:border-slate-800 pb-2">
                <i class="fa-solid fa-crown mr-2"></i> KLASEMEN JUARA UMUM
            </h2>

            <div id="containerJuaraUmum" class="space-y-3">
                <p class="text-xs text-slate-400 dark:text-slate-500 animate-pulse">Memuat data klasemen...</p>
            </div>
        </div>

        <!-- KARTU KLASEMEN PER POS LOMBA -->
        <div class="lg:col-span-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-xl space-y-4 transition-colors duration-300">
            <h2 class="text-base font-black text-emerald-600 dark:text-emerald-400 flex items-center border-b border-slate-200 dark:border-slate-800 pb-2">
                <i class="fa-solid fa-list-ol mr-2"></i> PERINGKAT TOP 3 PER POS LOMBA
            </h2>

            <div id="containerJuaraPos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-xs text-slate-400 dark:text-slate-500 animate-pulse col-span-2">Memuat data pos...</p>
            </div>
        </div>

    </div>

    <!-- TRACKING PROGRES POS KONTINGEN -->
    <div class="mt-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-xl space-y-4 transition-colors duration-300">
        <h2 class="text-base font-black text-cyan-600 dark:text-cyan-400 flex items-center border-b border-slate-200 dark:border-slate-800 pb-2">
            <i class="fa-solid fa-route mr-2"></i> MONITORING PROGRES POS KONTINGEN
        </h2>

        <div id="containerTracking" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <p class="text-xs text-slate-400 dark:text-slate-500 animate-pulse col-span-3">Memuat tracking progres...</p>
        </div>
    </div>

    <script>
        // Setup Theme & Logo Handler
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        const dashboardLogo = document.getElementById('dashboardLogo');

        function updateLogoAndThemeUI() {
            if (htmlElement.classList.contains('dark')) {
                themeIcon.className = "fa-solid fa-moon";
                dashboardLogo.src = "logo.png"; // Logo untuk Dark Mode
            } else {
                themeIcon.className = "fa-solid fa-sun";
                dashboardLogo.src = "logo1.png"; // Logo untuk Light Mode
            }
        }

        // Cek saved preference atau default ke dark
        if (localStorage.getItem('theme') === 'light') {
            htmlElement.classList.remove('dark');
        } else {
            htmlElement.classList.add('dark');
        }
        updateLogoAndThemeUI();

        function toggleTheme() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateLogoAndThemeUI();
        }

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxty9GSbJQtMy-Z21ffd1H3fuOgPh8FgliuiZVGvpLutDwsHp9rnz2Dk_y8eS8-tirb/exec";

        async function loadDashboard() {
            try {
                const res = await fetch(GAS_API_URL);
                const data = await res.json();

                renderJuaraUmum(data.juara_umum || []);
                renderJuaraPos(data.juara_pos || []);
                renderTracking(data.tracking || []);
            } catch (e) {
                console.error("Gagal update dashboard:", e);
            }
        }

        function renderJuaraUmum(list) {
            const container = document.getElementById('containerJuaraUmum');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 dark:text-slate-500">Belum ada rekap nilai masuk.</p>';
                return;
            }

            const medals = ['text-amber-500 dark:text-amber-400', 'text-slate-500 dark:text-slate-300', 'text-amber-700 dark:text-amber-600'];
            const badges = [
                'bg-amber-500/10 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 border-amber-500/30 dark:border-amber-500/40', 
                'bg-slate-500/10 dark:bg-slate-400/20 text-slate-700 dark:text-slate-300 border-slate-500/30 dark:border-slate-400/40', 
                'bg-amber-700/10 dark:bg-amber-700/20 text-amber-800 dark:text-amber-500 border-amber-700/30 dark:border-amber-700/40'
            ];

            list.forEach((item, index) => {
                const keys = Object.keys(item);
                const tim = item[keys[0]];
                const skor = item[keys[1]];

                const div = document.createElement('div');
                div.className = `p-3.5 rounded-xl border flex items-center justify-between ${badges[index] || 'bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl font-black ${medals[index] || 'text-slate-400 dark:text-slate-500'}">#${index + 1}</span>
                        <div>
                            <strong class="text-sm block font-bold text-slate-900 dark:text-white">${tim}</strong>
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block">Kandidat Juara Umum</span>
                        </div>
                    </div>
                    <span class="text-2xl font-black text-amber-600 dark:text-amber-400">${skor}</span>
                `;
                container.appendChild(div);
            });
        }

        function renderJuaraPos(list) {
            const container = document.getElementById('containerJuaraPos');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 dark:text-slate-500 col-span-2">Belum ada nilai pos masuk.</p>';
                return;
            }

            const grouped = {};
            list.forEach(row => {
                const keys = Object.keys(row);
                const pos = row[keys[0]];
                if (!grouped[pos]) grouped[pos] = [];
                if (grouped[pos].length < 3) grouped[pos].push(row);
            });

            for (const [posName, teamList] of Object.entries(grouped)) {
                const box = document.createElement('div');
                box.className = "bg-slate-50 dark:bg-slate-950/60 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2";
                
                let rowsHtml = '';
                teamList.forEach((t, idx) => {
                    const keys = Object.keys(t);
                    rowsHtml += `
                        <div class="flex justify-between items-center text-xs border-b border-slate-200 dark:border-slate-800/60 pb-1">
                            <span class="font-bold text-slate-700 dark:text-slate-300">${idx + 1}. ${t[keys[1]]}</span>
                            <span class="font-black text-emerald-600 dark:text-emerald-400">${t[keys[2]]}</span>
                        </div>
                    `;
                });

                box.innerHTML = `
                    <h3 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider border-b border-slate-200 dark:border-slate-800 pb-1">${posName}</h3>
                    <div class="space-y-1 mt-1">${rowsHtml}</div>
                `;
                container.appendChild(box);
            }
        }

        function renderTracking(list) {
            const container = document.getElementById('containerTracking');
            container.innerHTML = '';

            if (!list || list.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 dark:text-slate-500 col-span-3">Data tracking belum tersedia.</p>';
                return;
            }

            list.forEach(item => {
                const persen = Math.round((item.selesai_count / item.total_pos) * 100);

                let badgesSudah = item.pos_sudah.map(p => `<span class="bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 border border-emerald-500/30 dark:border-emerald-500/40 text-[10px] font-bold px-1.5 py-0.5 rounded">✓ ${p}</span>`).join(' ');
                let badgesBelum = item.pos_belum.map(p => `<span class="bg-red-500/10 dark:bg-red-500/20 text-red-700 dark:text-red-400 border border-red-500/30 dark:border-red-500/40 text-[10px] font-bold px-1.5 py-0.5 rounded">✗ ${p}</span>`).join(' ');

                const card = document.createElement('div');
                card.className = "bg-slate-50 dark:bg-slate-950 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <strong class="text-xs font-bold text-slate-900 dark:text-white block">${item.id_kontingen} - ${item.nama_tim}</strong>
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block">${item.kecamatan}</span>
                        </div>
                        <span class="text-xs font-black text-cyan-700 dark:text-cyan-400 bg-cyan-100 dark:bg-cyan-950/80 px-2 py-0.5 rounded-md border border-cyan-200 dark:border-cyan-800">${persen}%</span>
                    </div>

                    <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden">
                        <div class="bg-cyan-600 dark:bg-cyan-500 h-1.5 rounded-full transition-all duration-500" style="width: ${persen}%"></div>
                    </div>

                    <div class="flex flex-wrap gap-1 pt-1">
                        ${badgesSudah}
                        ${badgesBelum}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadDashboard();
        setInterval(loadDashboard, 15000);
    </script>
</body>
</html>
