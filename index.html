<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Juri - Jumbara PMR Mula Ke-4</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .pulse-dot { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        /* TEMA TERANG KHUSUS OUTDOOR TERIK MATAHARI */
        body.theme-light { background-color: #f8fafc !important; color: #0f172a !important; }
        body.theme-light .card-bg { background-color: #ffffff !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        body.theme-light .input-bg { background-color: #f1f5f9 !important; border-color: #94a3b8 !important; color: #0f172a !important; }
        body.theme-light .text-sub { color: #475569 !important; }
        body.theme-light .btn-preset-off { background-color: #e2e8f0 !important; color: #1e293b !important; border-color: #cbd5e1 !important; }

        /* PENGATURAN CETAK PRINTER THERMAL (58mm / 80mm) VIA BROWSER HP */
        @media print {
            @page { size: 58mm auto; margin: 0; }
            body * { visibility: hidden; }
            #areaCetakThermal, #areaCetakThermal * { visibility: visible; }
            #areaCetakThermal {
                position: absolute;
                left: 0;
                top: 0;
                width: 54mm;
                font-family: monospace;
                font-size: 8.5pt;
                color: #000 !important;
                background: #fff !important;
                padding: 4px;
            }
        }
    </style>
</head>
<body id="appBody" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans select-none">

    <!-- HEADER / NAVBAR -->
    <header class="bg-red-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <img id="imgLogoHeader" src="logo.png" alt="Logo Jumbara" class="h-8 w-auto object-contain transition-all duration-300">
                <div>
                    <h1 class="text-xs font-black tracking-wide leading-tight">JUMBARA PMR MULA KE-4</h1>
                    <p class="text-[9px] text-red-200">PMI Kab. Purbalingga 2026</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5">
                <!-- TOGGLE TEMA OUTDOOR TERANG/GELAP -->
                <button onclick="app.toggleTheme()" class="bg-red-800 hover:bg-red-900 text-white p-1.5 rounded-lg text-xs" title="Mode Siang/Malam">
                    <i id="icoTheme" class="fa-solid fa-sun text-amber-300"></i>
                </button>

                <div id="navActions" class="hidden flex items-center gap-1.5">
                    <button id="btnBT" onclick="app.connectBT()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-2 py-1 rounded-lg text-xs font-black flex items-center shadow">
                        <i class="fa-solid fa-print mr-1"></i> <span id="lblBT">Konek Printer</span>
                    </button>
                    <button onclick="app.bukaRiwayat()" class="bg-red-900/60 text-amber-300 p-1.5 rounded-lg text-xs font-bold" title="Riwayat">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </button>
                    <button onclick="app.logout()" class="bg-red-900/60 text-red-200 p-1.5 rounded-lg text-xs font-bold" title="Keluar">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTAINER UTAMA -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow flex flex-col justify-center space-y-4">

        <!-- FORM LOGIN JURI SECURE -->
        <div id="secLogin" class="card-bg bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-4">
            <div class="text-center">
                <img id="imgLogoLogin" src="logo.png" alt="Logo Jumbara" class="h-24 w-auto mx-auto mb-2 drop-shadow-lg object-contain transition-all duration-300">
                <h2 class="text-lg font-black">LOGIN JURI POS</h2>
                <p class="text-xs text-sub text-slate-400">Pilih ID Juri & Masukkan PIN</p>
            </div>

            <div>
                <label class="text-xs font-bold text-sub text-slate-300 mb-1 block">PILIH NAMA JURI</label>
                <select id="selJuri" class="input-bg w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:border-red-500 outline-none">
                    <option value="">-- Memuat Data Juri... --</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-bold text-sub text-slate-300 mb-1 block">PIN RAHASIA</label>
                <input id="txtPin" type="password" maxlength="6" inputmode="numeric" class="input-bg w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-lg font-bold tracking-widest focus:border-red-500 outline-none text-amber-400" placeholder="****">
            </div>

            <button id="btnLogin" onclick="app.login()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                MASUK PORTAL
            </button>
        </div>

        <!-- FORM PENILAIAN -->
        <div id="secForm" class="hidden space-y-4">
            
            <!-- INFO JURI LOGGED IN -->
            <div class="card-bg bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                <div>
                    <span class="text-sub text-slate-400 block">Juri Tersetel:</span>
                    <strong id="lblNamaJuri" class="text-red-500 font-bold text-sm"></strong>
                </div>
                <div class="text-right">
                    <span class="text-sub text-slate-400 block">Pos Tugas:</span>
                    <span id="lblPosJuri" class="bg-red-950 text-red-300 border border-red-800 px-2 py-0.5 rounded font-mono font-bold"></span>
                </div>
            </div>

            <!-- CETAK ULANG -->
            <div class="flex justify-between items-center gap-2">
                <button onclick="app.cetakUlangTerakhir()" class="card-bg w-1/2 bg-slate-800 border border-slate-700 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-rotate-left text-amber-400"></i>
                    <span>Struk Terakhir</span>
                </button>
                <button onclick="app.cetakRekapPos()" class="card-bg w-1/2 bg-slate-800 border border-slate-700 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-file-invoice text-emerald-400"></i>
                    <span>Cetak Rekap Pos</span>
                </button>
            </div>

            <!-- DROPDOWN KONTINGEN (AUTOMATIC FILTERING) -->
            <div class="card-bg bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <div>
                    <label class="text-xs font-bold text-sub text-slate-300 mb-1 block">PILIH KONTINGEN / TIM (BELUM DINILAI)</label>
                    <select id="selKontingen" class="input-bg w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm font-bold focus:border-red-500 outline-none">
                        <option value="">-- Pilih Tim --</option>
                    </select>
                </div>
            </div>

            <!-- STOPWATCH TIMER TOGGLE -->
            <div class="card-bg bg-slate-800 p-4 rounded-xl border border-slate-700 text-center space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                    <span class="text-xs font-bold text-sub text-slate-400 uppercase">Stopwatch Durasi</span>
                    <span id="lblTimerBadge" class="bg-slate-900 text-slate-400 text-[10px] px-2 py-0.5 rounded-full font-bold">Standby</span>
                </div>
                
                <div id="lblTimerDisplay" class="font-mono text-4xl font-extrabold tracking-widest text-emerald-400 my-1">
                    00:00
                </div>

                <button id="btnTimerStart" onclick="app.toggleTimer()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg">
                    <i class="fa-solid fa-play"></i> <span>MULAI STOPWATCH (Buka Form)</span>
                </button>
            </div>

            <!-- PERINGATAN KUNCI FORM -->
            <div id="msgFormLocked" class="bg-amber-950/80 border border-amber-800 p-2.5 rounded-xl text-center text-xs text-amber-300 font-bold flex items-center justify-center space-x-2">
                <i class="fa-solid fa-lock text-amber-400"></i>
                <span>Jalankan Stopwatch untuk membuka Form Penilaian</span>
            </div>

            <!-- RUBRIK HYBRID (PRESET + MANUAL) -->
            <div class="card-bg bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <label class="text-xs font-bold text-amber-400 block border-b border-slate-700/60 pb-1">
                    <i class="fa-solid fa-list-check mr-1"></i> RUBRIK PENILAIAN (<span id="lblKodePosRubrik"></span>)
                </label>
                
                <div id="containerRubrik" class="space-y-3">
                    <!-- Terisi Otomatis -->
                </div>

                <div class="input-bg bg-slate-900 p-3 rounded-xl border border-slate-700 flex justify-between items-center mt-3">
                    <span class="text-xs font-bold text-sub text-slate-300">TOTAL SKOR:</span>
                    <span id="lblTotalSkorAuto" class="text-2xl font-black text-amber-400">0</span>
                </div>
            </div>

            <!-- SIMPAN & CETAK -->
            <div class="card-bg bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="text-xs font-bold text-sub text-slate-300 mb-1 block">DURASI PENAMPILAN (DETIK)</label>
                        <input id="txtDurasi" type="number" readonly class="input-bg w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-lg font-black text-emerald-400 text-center outline-none" placeholder="0">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-sub text-slate-300 mb-1 block">CATATAN EVALUASI JURI</label>
                        <textarea id="txtCatatan" rows="2" class="input-bg w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs outline-none" placeholder="Masukkan catatan evaluasi jika ada..."></textarea>
                    </div>
                </div>

                <button id="btnSimpan" onclick="app.simpan()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow-lg flex items-center justify-center space-x-2 text-sm transition">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>SIMPAN & CETAK STRUK</span>
                </button>
            </div>
        </div>

    </main>

    <!-- AREA TERSEMBUNYI UNTUK FORMAT CETAK PRINTER THERMAL HP (FALLBACK) -->
    <div id="areaCetakThermal" class="hidden"></div>

    <!-- MODAL RIWAYAT -->
    <div id="modalHistory" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="card-bg bg-slate-800 w-full max-w-md rounded-2xl shadow-xl flex flex-col max-h-[80vh] border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-sm text-amber-400 flex items-center space-x-2">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Riwayat Penilaian Pos</span>
                </h3>
                <button onclick="app.tutupRiwayat()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="listHistoryContainer" class="p-4 overflow-y-auto space-y-2.5 flex-grow text-xs"></div>
            <div class="p-3 border-t border-slate-700 bg-slate-900 flex justify-end">
                <button onclick="app.tutupRiwayat()" class="bg-slate-700 text-white text-xs px-4 py-2 rounded-lg font-bold">Tutup</button>
            </div>
        </div>
    </div>

    <footer class="p-3 text-center text-xs text-sub text-slate-500">
        &copy; Panitia Jumbara PMR Mula Ke-4 Purbalingga
    </footer>

    <!-- LOGIKA UTAMA SCRIPT -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxty9GSbJQtMy-Z21ffd1H3fuOgPh8FgliuiZVGvpLutDwsHp9rnz2Dk_y8eS8-tirb/exec";

        const app = {
            masterData: null,
            btDevice: null,
            btChar: null,
            currentJuri: null,
            timerInterval: null,
            timerSeconds: 0,
            timerRunning: false,
            isLightMode: false,

            init: async function() {
                window.addEventListener('beforeunload', (e) => {
                    if (this.timerRunning) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });

                const sel = document.getElementById('selJuri');
                if (!GAS_API_URL || GAS_API_URL.includes("GANTI_DENGAN_URL")) {
                    sel.innerHTML = '<option value="">⚠️ Isikan URL Apps Script di index.html</option>';
                    return;
                }

                try {
                    const res = await fetch(GAS_API_URL);
                    this.masterData = await res.json();
                    this.renderJuriOptions();
                    this.checkSession();
                } catch (e) {
                    console.error(e);
                    sel.innerHTML = '<option value="">⚠️ Gagal terhubung ke server</option>';
                }
            },

            toggleTheme: function() {
                this.isLightMode = !this.isLightMode;
                const body = document.getElementById('appBody');
                const ico = document.getElementById('icoTheme');
                const imgHeader = document.getElementById('imgLogoHeader');
                const imgLogin = document.getElementById('imgLogoLogin');

                if (this.isLightMode) {
                    body.classList.add('theme-light');
                    ico.className = "fa-solid fa-moon text-slate-200";
                    if (imgHeader) imgHeader.src = "logo1.png";
                    if (imgLogin) imgLogin.src = "logo1.png";
                } else {
                    body.classList.remove('theme-light');
                    ico.className = "fa-solid fa-sun text-amber-300";
                    if (imgHeader) imgHeader.src = "logo.png";
                    if (imgLogin) imgLogin.src = "logo.png";
                }
            },

            renderJuriOptions: function() {
                const sel = document.getElementById('selJuri');
                sel.innerHTML = '<option value="">-- Pilih Nama Juri --</option>';
                if (this.masterData && this.masterData.juri) {
                    this.masterData.juri.forEach(j => {
                        const id = j.ID_JURI || j.id_juri || j.ID || j.id;
                        const nama = j.NAMA_JURI || j.nama_juri || j.NAMA || j.nama;
                        const pos = j.KODE_POS || j.kode_pos || j.POS || j.pos;
                        sel.innerHTML += `<option value="${id}">${nama} (${pos})</option>`;
                    });
                }
            },

            login: async function() {
                const idJuri = document.getElementById('selJuri').value;
                const pin = document.getElementById('txtPin').value;

                if (!idJuri || !pin) return alert("Pilih Juri dan masukkan PIN!");

                const btn = document.getElementById('btnLogin');
                btn.disabled = true;
                btn.innerText = "VERIFIKASI PIN...";

                try {
                    const res = await fetch(GAS_API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "LOGIN", id_juri: idJuri, pin: pin })
                    });
                    const result = await res.json();

                    if (result.status === "SUCCESS") {
                        this.currentJuri = result.juri;
                        sessionStorage.setItem('juriSession', JSON.stringify(this.currentJuri));
                        this.showDashboard();
                    } else {
                        alert("⚠️ " + (result.message || "PIN Salah!"));
                    }
                } catch(e) {
                    alert("Gagal koneksi server: " + e.message);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "MASUK PORTAL";
                }
            },

            checkSession: function() {
                const sess = sessionStorage.getItem('juriSession');
                if (sess) {
                    this.currentJuri = JSON.parse(sess);
                    this.showDashboard();
                }
            },

            showDashboard: function() {
                document.getElementById('secLogin').classList.add('hidden');
                document.getElementById('secForm').classList.remove('hidden');
                document.getElementById('navActions').classList.remove('hidden');

                const namaJuri = this.currentJuri.NAMA_JURI || this.currentJuri.nama_juri || '';
                const kodePos = this.currentJuri.KODE_POS || this.currentJuri.kode_pos || '';

                document.getElementById('lblNamaJuri').innerText = namaJuri;
                document.getElementById('lblPosJuri').innerText = kodePos;

                this.renderKontingenOptions();
                this.renderRubrikDinamis();
                this.resetTimer();
            },

            renderKontingenOptions: function() {
                const sel = document.getElementById('selKontingen');
                sel.innerHTML = '<option value="">-- Pilih Tim (Belum Dinilai) --</option>';
                
                if (!this.masterData || !this.masterData.kontingen) return;

                const posJuri = String(this.currentJuri ? (this.currentJuri.KODE_POS || this.currentJuri.kode_pos) : '').toUpperCase().trim();
                const listLokal = JSON.parse(localStorage.getItem('sijum_history_v2')) || [];
                let countTampil = 0;

                this.masterData.kontingen.forEach(k => {
                    const id = k.ID_KONTINGEN || k.id_kontingen || k.ID || k.id;
                    const nama = k.NAMA_TIM || k.nama_tim || k.NAMA || k.nama;
                    const kec = k.KECAMATAN || k.kecamatan || '';

                    if (id || nama) {
                        let sudah = false;
                        if (posJuri && this.masterData.tracking) {
                            const trackItem = this.masterData.tracking.find(t => 
                                String(t.id_kontingen || '').trim() === String(id).trim() ||
                                String(t.nama_tim || '').toLowerCase().trim() === String(nama).toLowerCase().trim()
                            );
                            if (trackItem && trackItem.pos_sudah) {
                                const posSudahUpper = trackItem.pos_sudah.map(p => String(p).toUpperCase().trim());
                                if (posSudahUpper.includes(posJuri)) sudah = true;
                            }
                        }

                        if (!sudah && posJuri) {
                            const diLokal = listLokal.some(h => 
                                String(h.pos_lomba || '').toUpperCase().trim() === posJuri && 
                                (h.kontingen.includes(id) || h.kontingen.includes(nama))
                            );
                            if (diLokal) sudah = true;
                        }

                        if (!sudah) {
                            const displayLabel = id ? `${id} - ${nama}` : nama;
                            sel.innerHTML += `<option value="${displayLabel}">${displayLabel} (${kec})</option>`;
                            countTampil++;
                        }
                    }
                });

                if (countTampil === 0) {
                    sel.innerHTML = '<option value="">🎉 Semua kontingen telah selesai dinilai di pos ini!</option>';
                }

                sel.onchange = () => this.resetTimer();
            },

            renderRubrikDinamis: function() {
                const container = document.getElementById('containerRubrik');
                const posJuri = String(this.currentJuri ? (this.currentJuri.KODE_POS || this.currentJuri.kode_pos) : '').toUpperCase().trim();
                document.getElementById('lblKodePosRubrik').innerText = posJuri;
                container.innerHTML = '';

                if (!this.masterData || !this.masterData.rubrik) {
                    container.innerHTML = '<p class="text-xs text-red-400">Data rubrik tidak ditemukan.</p>';
                    return;
                }

                const items = this.masterData.rubrik.filter(r => {
                    const rPos = String(r.KODE_POS || r.kode_pos || r.POS || r.pos || '').toUpperCase().trim();
                    return rPos === posJuri;
                });

                if (items.length === 0) {
                    container.innerHTML = '<p class="text-xs text-amber-400">Pos ini belum memiliki kriteria rubrik di tab RUBRIK.</p>';
                    return;
                }

                items.forEach((item, index) => {
                    const namaItem = item.NAMA_TANTANGAN || item.NAMA_ITEM || item.nama_item || item.item || item.NO_SOAL || `Item ${index + 1}`;
                    const bobotMaks = parseFloat(item.SKOR_MAKSIMAL || item.BOBOT_MAKS || item.bobot_maks || item.maks || 100);
                    
                    // CEK KHUSUS ITEM BIDAK (POS-05 ULAR TANGGA)
                    const isBidak = namaItem.toUpperCase().includes('BIDAK');

                    // DUKUNGAN OPSI A, B, C, D DARI GOOGLE SHEETS RUBRIK
                    let presets = [];
                    if (item.OPSI_A || item.A) {
                        const oA = parseFloat(item.OPSI_A || item.A);
                        const oB = parseFloat(item.OPSI_B || item.B);
                        const oC = parseFloat(item.OPSI_C || item.C);
                        const oD = parseFloat(item.OPSI_D || item.D);
                        if (!isNaN(oA)) presets.push(oA);
                        if (!isNaN(oB)) presets.push(oB);
                        if (!isNaN(oC)) presets.push(oC);
                        if (!isNaN(oD)) presets.push(oD);
                    } else if (item.OPTIONS || item.options) {
                        const opts = item.OPTIONS || item.options;
                        presets = opts.split(',').map(o => {
                            const raw = o.trim();
                            return raw.includes(':') ? parseFloat(raw.split(':')[1]) : parseFloat(raw);
                        }).filter(n => !isNaN(n));
                    }

                    if (presets.length === 0 && !isBidak) {
                        presets = [
                            Math.round(bobotMaks * 0.25),
                            Math.round(bobotMaks * 0.50),
                            Math.round(bobotMaks * 0.75),
                            bobotMaks
                        ];
                    }

                    const buttonsHtml = presets.map(val => `
                        <button type="button" 
                                onclick="app.pilihPresetRubrik(this, 'inp_rubrik_${index}', ${val})" 
                                class="btn-preset-${index} btn-opt-rubrik btn-preset-off flex-1 py-2 px-1 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-xs font-bold transition text-center shadow-sm">
                            ${val}
                        </button>
                    `).join('');

                    const div = document.createElement('div');
                    div.className = "input-bg bg-slate-900 p-3 rounded-xl border border-slate-700 space-y-2.5";

                    if (isBidak) {
                        // TAMPILAN KHUSUS PETAK BIDAK (TIDAK HITUNG SKOR UTAMA)
                        div.innerHTML = `
                            <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
                                <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
                                    <i class="fa-solid fa-dice text-amber-500"></i> ${namaItem} (Tie-Breaker)
                                </span>
                                <span class="text-[10px] bg-amber-950 text-amber-300 border border-amber-800 px-2 py-0.5 rounded font-mono">Bidak Petak Dadu</span>
                            </div>
                            <div class="flex justify-between items-center pt-1">
                                <span class="text-[11px] text-sub text-slate-400">Nomor Bidak Terakhir:</span>
                                <input id="inp_rubrik_${index}"
                                       type="number" 
                                       min="1" 
                                       max="${bobotMaks}" 
                                       data-item="${namaItem}" 
                                       data-maks="${bobotMaks}" 
                                       data-group="${index}"
                                       data-is-bidak="true"
                                       class="input-rubrik input-bg bg-slate-800 border border-amber-600 rounded-lg p-1.5 w-24 text-center font-bold text-amber-300 text-sm focus:border-red-500 outline-none" 
                                       placeholder="No. Bidak">
                            </div>
                        `;
                    } else {
                        // TAMPILAN KRITERIA RUBRIK REGULER
                        div.innerHTML = `
