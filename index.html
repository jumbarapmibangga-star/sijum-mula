<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penilaian Jumbara PMR Mula 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Segoe UI', Roboto, sans-serif; }
    .card-custom { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header-pos { background: linear-gradient(135deg, #FF0040, #dc2626); color: white; border-radius: 12px 12px 0 0; padding: 20px; }
    .badge-score { background-color: #fef2f2; color: #FF0040; border: 1px solid #fca5a5; font-size: 1.2rem; font-weight: bold; }
    .timer-display { font-family: monospace; font-size: 1.5rem; font-weight: bold; }
  </style>
</head>
<body class="py-4">

<div class="container" style="max-width: 720px;">
  <!-- FORM LOGIN JURI -->
  <div id="loginCard" class="card card-custom">
    <div class="header-pos text-center">
      <h4 class="m-0 font-weight-bold">LOGIN JURI PENILAI</h4>
      <small>Jumbara PMR Mula Kabupaten Purbalingga 2026</small>
    </div>
    <div class="card-body p-4">
      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label font-weight-bold">ID JURI</label>
          <input type="text" id="loginIdJuri" class="form-control" placeholder="Contoh: JURI05" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">PIN RAHASIA</label>
          <input type="password" id="loginPin" class="form-control" placeholder="Masukkan PIN" required>
        </div>
        <button type="submit" id="btnLoginSubmit" class="btn btn-danger w-100 py-2 font-weight-bold" style="background-color: #FF0040; border: none;">MASUK APLIKASI</button>
      </form>
    </div>
  </div>

  <!-- MAIN SCORING APP CARD -->
  <div id="scoringCard" class="card card-custom d-none">
    <div class="header-pos d-flex justify-content-between align-items-center">
      <div>
        <h5 class="m-0 font-weight-bold" id="dispPos">POS LOMBA</h5>
        <small id="dispJuri">Juri: -</small>
      </div>
      <button class="btn btn-sm btn-outline-light" onclick="logout()">Keluar</button>
    </div>

    <div class="card-body p-4">
      <!-- KONTINGEN & TIMER -->
      <div class="row g-3 mb-4">
        <div class="col-md-7">
          <label class="form-label font-weight-bold">PILIH KONTINGEN / TIM</label>
          <select id="selectKontingen" class="form-select" required>
            <option value="">-- Pilih Kontingen --</option>
          </select>
        </div>
        <div class="col-md-5 text-center">
          <label class="form-label font-weight-bold">DURASI TAMPIL</label>
          <div class="d-flex align-items-center justify-content-center gap-2">
            <span id="dispTimer" class="timer-display text-danger">00:00</span>
            <button id="btnTimer" type="button" class="btn btn-sm btn-outline-secondary" onclick="toggleTimer()">Start</button>
          </div>
        </div>
      </div>

      <!-- FORM RUBRIK PENILAIAN -->
      <form id="formPenilaian">
        <h6 class="font-weight-bold border-bottom pb-2 text-danger" style="color: #FF0040 !important;">LEMBAR PENILAIAN RUBRIK</h6>
        
        <div class="table-responsive">
          <table class="table table-bordered align-middle mt-2" id="tableRubrik">
            <thead class="table-light text-center">
              <tr id="tableHeaderRow"></tr>
            </thead>
            <tbody id="rubrikBody"></tbody>
          </table>
        </div>

        <!-- TOTAL SKOR -->
        <div class="d-flex justify-content-between align-items-center p-3 badge-score rounded mb-3">
          <span>TOTAL SKOR UTAMA</span>
          <span id="dispTotalSkor">0 PT</span>
        </div>

        <div class="mb-3">
          <label class="form-label font-weight-bold">CATATAN / EVALUASI JURI</label>
          <textarea id="inputCatatan" class="form-control" rows="2" placeholder="Tuliskan catatan juri jika ada..."></textarea>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-danger w-100 py-3 font-weight-bold" style="background-color: #FF0040; border: none;">SIMPAN & CETAK HASIL</button>
      </form>
    </div>
  </div>
</div>

<script>
  let activeJuri = null;
  let rubrikData = [];
  let timerInterval = null;
  let timerSeconds = 0;
  let isPos5 = false;

  // GANTI URL DEPLOY APPS SCRIPT ANDA DI SINI
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxty9GSbJQtMy-Z21ffd1H3fuOgPh8FgliuiZVGvpLutDwsHp9rnz2Dk_y8eS8-tirb/exec";

  document.getElementById('formLogin').addEventListener('submit', function(e) {
    e.preventDefault();
    const idJuri = document.getElementById('loginIdJuri').value.trim();
    const pin = document.getElementById('loginPin').value.trim();
    const btn = document.getElementById('btnLoginSubmit');

    btn.disabled = true;
    btn.innerText = "Memverifikasi...";

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'LOGIN', id_juri: idJuri, pin: pin })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "MASUK APLIKASI";
      if(res.status === 'SUCCESS') {
        activeJuri = res.juri;
        initApp();
      } else {
        alert(res.message);
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "MASUK APLIKASI";
      alert("Gagal koneksi ke server!");
    });
  });

  function initApp() {
    document.getElementById('loginCard').classList.add('d-none');
    document.getElementById('scoringCard').classList.remove('d-none');
    
    document.getElementById('dispPos').innerText = activeJuri.KODE_POS;
    document.getElementById('dispJuri').innerText = "Juri: " + activeJuri.NAMA_JURI;

    const posCode = String(activeJuri.KODE_POS).toUpperCase();
    isPos5 = posCode.includes('POS5') || posCode.includes('POS-05') || posCode.includes('ULAR') || posCode === '5';

    // Set Header Tabel
    const headerRow = document.getElementById('tableHeaderRow');
    if (isPos5) {
      headerRow.innerHTML = `
        <th style="width: 8%;">No</th>
        <th style="width: 42%;">Soal / Tantangan</th>
        <th style="width: 25%;">No. Bidak</th>
        <th style="width: 25%;">Skor Jawaban</th>
      `;
    } else {
      headerRow.innerHTML = `
        <th style="width: 10%;">No</th>
        <th style="width: 65%;">Kriteria / Aspek Penilaian</th>
        <th style="width: 25%;">Skor (0 - Max)</th>
      `;
    }

    loadInitialData();
  }

  function loadInitialData() {
    fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
      // Load Dropdown Kontingen
      const selectK = document.getElementById('selectKontingen');
      selectK.innerHTML = '<option value="">-- Pilih Kontingen --</option>';
      data.kontingen.forEach(k => {
        const idKont = k.ID_KONTINGEN || k.id_kontingen || '';
        const nameKont = k.NAMA_TIM || k.nama_tim || k.NAMA || k.nama || '';
        const fullName = (idKont ? idKont + " - " : "") + nameKont;
        selectK.innerHTML += `<option value="${fullName}">${fullName}</option>`;
      });

      // Render Rubrik untuk Pos Login
      const rubrikBody = document.getElementById('rubrikBody');
      rubrikBody.innerHTML = '';
      
      rubrikData = data.rubrik.filter(r => {
        const rPos = String(r.KODE_POS || r.kode_pos || r.POS || '').toUpperCase().trim();
        return rPos === String(activeJuri.KODE_POS).toUpperCase().trim();
      });

      if (rubrikData.length === 0) {
        rubrikBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Rubrik pos ini belum diinput di sheet RUBRIK.</td></tr>';
        return;
      }

      rubrikData.forEach((item, index) => {
        const itemTitle = item.NAMA_TANTANGAN || item.NAMA_ITEM || item.NO_SOAL || `Item ${index + 1}`;
        const maxScore = Number(item.SKOR_MAKSIMAL || item.BOBOT_MAKS || 100);

        // Petunjuk Opsi Nilai (A/B/C/D) jika ada
        let opsiHint = '';
        if (item.OPSI_A || item.A) {
          opsiHint = `<br/><small class="text-muted">Pilihan Skor: A=${item.OPSI_A||item.A}, B=${item.OPSI_B||item.B}, C=${item.OPSI_C||item.C}${item.OPSI_D||item.D ? ', D='+(item.OPSI_D||item.D):''}</small>`;
        }

        if (isPos5) {
          rubrikBody.innerHTML += `
            <tr>
              <td class="text-center font-weight-bold">${index + 1}</td>
              <td>${itemTitle} <small class="text-danger font-weight-bold">(Max: ${maxScore})</small>${opsiHint}</td>
              <td>
                <input type="number" class="form-control text-center input-bidak" data-title="${itemTitle}" placeholder="Bidak" min="1">
              </td>
              <td>
                <input type="number" class="form-control text-center input-skor" data-title="${itemTitle}" data-max="${maxScore}" placeholder="0 - ${maxScore}" min="0" max="${maxScore}" required onchange="hitungTotal()">
              </td>
            </tr>
          `;
        } else {
          rubrikBody.innerHTML += `
            <tr>
              <td class="text-center font-weight-bold">${index + 1}</td>
              <td>${itemTitle} <small class="text-danger font-weight-bold">(Max: ${maxScore})</small>${opsiHint}</td>
              <td>
                <input type="number" class="form-control text-center input-skor" data-title="${itemTitle}" data-max="${maxScore}" placeholder="0 - ${maxScore}" min="0" max="${maxScore}" required onchange="hitungTotal()">
              </td>
            </tr>
          `;
        }
      });
    });
  }

  function hitungTotal() {
    let total = 0;
    const inputsSkor = document.querySelectorAll('.input-skor');
    inputsSkor.forEach(input => {
      let val = Number(input.value || 0);
      const max = Number(input.dataset.max || 100);
      
      if (val > max) {
        alert(`Skor melebihi batas nilai maksimal (${max})!`);
        input.value = max;
        val = max;
      }
      if (val < 0) {
        input.value = 0;
        val = 0;
      }
      total += val;
    });
    document.getElementById('dispTotalSkor').innerText = total + " PT";
  }

  function toggleTimer() {
    const btn = document.getElementById('btnTimer');
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
      btn.innerText = "Start";
      btn.className = "btn btn-sm btn-outline-secondary";
    } else {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const s = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('dispTimer').innerText = `${m}:${s}`;
      }, 1000);
      btn.innerText = "Pause";
      btn.className = "btn btn-sm btn-warning";
    }
  }

  document.getElementById('formPenilaian').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const kontingen = document.getElementById('selectKontingen').value;
    if (!kontingen) return alert("Pilih kontingen terlebih dahulu!");

    const rincianNilai = {};
    let totalSkor = 0;

    const inputsSkor = document.querySelectorAll('.input-skor');
    inputsSkor.forEach(input => {
      const title = input.dataset.title;
      const skorVal = Number(input.value || 0);
      totalSkor += skorVal;

      if (isPos5) {
        const inputBidak = document.querySelector(`.input-bidak[data-title="${title}"]`);
        const bidakVal = inputBidak ? (inputBidak.value || "-") : "-";
        rincianNilai[title] = { no_bidak: bidakVal, skor: skorVal };
      } else {
        rincianNilai[title] = { skor: skorVal };
      }
    });

    const payload = {
      nama_juri: activeJuri.NAMA_JURI,
      pos_lomba: activeJuri.KODE_POS,
      kontingen: kontingen,
      total_skor: totalSkor,
      durasi: timerSeconds,
      catatan: document.getElementById('inputCatatan').value,
      rincian_nilai: rincianNilai
    };

    const btnSubmit = document.getElementById('btnSubmit');
    btnSubmit.disabled = true;
    btnSubmit.innerText = "Menyimpan Data...";

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "SIMPAN & CETAK HASIL";

      if (res.status === 'SUCCESS') {
        alert("Penilaian berhasil disimpan!");
        if (res.pdf_url) window.open(res.pdf_url, '_blank');
        location.reload();
      } else {
        alert(res.message);
      }
    })
    .catch(err => {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "SIMPAN & CETAK HASIL";
      alert("Gagal menyimpan data nilai!");
    });
  });

  function logout() {
    location.reload();
  }
</script>
</body>
</html>
