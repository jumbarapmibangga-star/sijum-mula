<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Juri - Jumbara PMR</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .pulse-dot { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans select-none">

    <!-- HEADER / NAVBAR -->
    <header class="bg-red-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-square-poll-vertical text-xl"></i>
                <h1 class="text-base font-bold tracking-wide">PORTAL JURI JUMBARA</h1>
            </div>
            <div id="navActions" class="hidden flex items-center gap-1.5">
                <button id="btnBT" onclick="app.connectBT()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-2 py-1 rounded-lg text-xs font-black flex items-center shadow">
                    <i class="fa-solid fa-print mr-1"></i> <span id="lblBT">Konek Printer</span>
                </button>
                <button onclick="app.bukaRiwayat()" class="bg-slate-800 text-blue-300 hover:text-white px-2 py-1 rounded-lg text-xs font-bold" title="Riwayat Penilaian">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
                <button onclick="app.logout()" class="bg-slate-800 text-red-300 hover:text-white px-2 py-1 rounded-lg text-xs font-bold" title="Keluar">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER UTAMA -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow flex flex-col justify-center space-y-4">

        <!-- FORM LOGIN JURI -->
        <div id="secLogin" class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-4">
            <div class="text-center">
                <i class="fa-solid fa-user-shield text-4xl text-red-500 mb-2"></i>
                <h2 class="text-xl font-black">LOGIN JURI POS</h2>
                <p class="text-xs text-slate-400">Pilih ID Juri & masukkan PIN resmi</p>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-300 mb-1 block">PILIH NAMA JURI</label>
                <select id="selJuri" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:border-red-500 outline-none text-white">
                    <option value="">-- Memuat Data Juri... --</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-300 mb-1 block">PIN RAHASIA</label>
                <input id="txtPin" type="password" maxlength="6" inputmode="numeric" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-lg font-bold tracking-widest focus:border-red-500 outline-none text-amber-400" placeholder="****">
            </div>

            <button onclick="app.login()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                MASUK PORTAL
            </button>
        </div>

        <!-- FORM PENILAIAN -->
        <div id="secForm" class="hidden space-y-4">
            
            <!-- INFO JURI LOGGED IN -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                <div>
                    <span class="text-slate-400 block">Juri Tersetel:</span>
                    <strong id="lblNamaJuri" class="text-red-400 font-bold text-sm"></strong>
                </div>
                <div class="text-right">
                    <span class="text-slate-400 block">Pos Tugas:</span>
                    <span id="lblPosJuri" class="bg-red-950 text-red-300 border border-red-800 px-2 py-0.5 rounded font-mono font-bold"></span>
                </div>
            </div>

            <!-- TOMBOL QUICK ACTION: CETAK ULANG STRUK TERAKHIR -->
            <div class="flex justify-between items-center gap-2">
                <button onclick="app.cetakUlangTerakhir()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-left text-amber-400"></i>
                    <span>Cetak Struk Terakhir</span>
                </button>
            </div>

            <!-- INPUT KONTINGEN -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <div>
                    <label class="text-xs font-bold text-slate-300 mb-1 block">PILIH KONTINGEN / TIM</label>
                    <select id="selKontingen" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm font-bold focus:border-red-500 outline-none text-white">
                        <option value="">-- Pilih Tim --</option>
                    </select>
                </div>
            </div>

            <!-- STOPWATCH TIMER OTOMATIS -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase">Stopwatch Durasi</span>
                    <span id="lblTimerBadge" class="bg-slate-900 text-slate-400 text-[10px] px-2 py-0.5 rounded-full font-bold">Standby</span>
                </div>
                
                <div id="lblTimerDisplay" class="font-mono text-4xl font-extrabold tracking-widest text-emerald-400 my-1">
                    00:00
                </div>

                <div class="flex justify-center items-center gap-2">
                    <button id="btnTimerStart" onclick="app.startTimer()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-play"></i> <span>Mulai</span>
                    </button>
                    <button id="btnTimerPause" onclick="app.pauseTimer()" disabled class="flex-1 bg-amber-600 hover:bg-amber-500 disabled:opacity-40 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-pause"></i> <span>Jeda</span>
                    </button>
                    <button id="btnTimerReset" onclick="app.resetTimer()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-2 px-3 rounded-lg transition">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- WADAH RUBRIK PENILAIAN DINAMIS -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <label class="text-xs font-bold text-amber-400 block border-b border-slate-700 pb-1">
                    <i class="fa-solid fa-list-check mr-1"></i> RUBRIK PENILAIAN (<span id="lblKodePosRubrik"></span>)
                </label>
                
                <div id="containerRubrik" class="space-y-2.5">
                    <!-- Terisi Otomatis Berdasarkan Pos Juri -->
                </div>

                <!-- TOTAL SKOR AKUMULASI -->
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex justify-between items-center mt-3">
                    <span class="text-xs font-bold text-slate-300">TOTAL SKOR:</span>
                    <span id="lblTotalSkorAuto" class="text-2xl font-black text-amber-400">0 Poin</span>
                </div>
            </div>

            <!-- INPUT DURASI TERHUBUNG & CATATAN -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="text-xs font-bold text-slate-300 mb-1 block">DURASI PENAMPILAN (DETIK)</label>
                        <input id="txtDurasi" type="number" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-lg font-black text-emerald-400 text-center outline-none" placeholder="0">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-300 mb-1 block">CATATAN EVALUASI JURI</label>
                        <textarea id="txtCatatan" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none" placeholder="Masukkan catatan evaluasi jika ada..."></textarea>
                    </div>
                </div>

                <button id="btnSimpan" onclick="app.simpan()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow-lg flex items-center justify-center space-x-2 text-sm transition">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>SIMPAN & CETAK STRUK</span>
                </button>
            </div>
        </div>

    </main>

    <!-- MODAL RIWAYAT PENILAIAN -->
    <div id="modalHistory" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-md rounded-2xl shadow-xl flex flex-col max-h-[80vh] border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-sm text-amber-400 flex items-center space-x-2">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Riwayat Penilaian Pos</span>
                </h3>
                <button onclick="app.tutupRiwayat()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="listHistoryContainer" class="p-4 overflow-y-auto space-y-2.5 flex-grow text-xs">
                <!-- Disajikan via JS -->
            </div>
            <div class="p-3 border-t border-slate-700 bg-slate-900 flex justify-end">
                <button onclick="app.tutupRiwayat()" class="bg-slate-700 text-white text-xs px-4 py-2 rounded-lg font-bold">Tutup</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="p-3 text-center text-xs text-slate-500">
        &copy; Panitia Jumbara PMR Mula - System v2.0 PWA
    </footer>

    <!-- LOGIKA UTAMA APLIKASI -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // MASUKKAN URL GOOGLE APPS SCRIPT ASLI ANDA DI SINI
        const GAS_API_URL = "GANTI_DENGAN_URL_DEPLOYMENT_APPS_SCRIPT_KAMU";

        const app = {
            masterData: null,
            btChar: null,
            currentJuri: null,
            timerInterval: null,
            timerSeconds: 0,
            timerRunning: false,

            init: async function() {
                try {
                    const res = await fetch(GAS_API_URL);
                    this.masterData = await res.json();
                    this.renderJuriOptions();
                    this.checkSession();
                } catch (e) {
                    alert("Gagal memuat data master dari server: " + e.message);
                }
            },

            renderJuriOptions: function() {
                const sel = document.getElementById('selJuri');
                sel.innerHTML = '<option value="">-- Pilih Nama Juri --</option>';
                if(this.masterData && this.masterData.juri) {
                    this.masterData.juri.forEach(j => {
                        sel.innerHTML += `<option value="${j.ID_JURI}">${j.NAMA_JURI} (${j.KODE_POS})</option>`;
                    });
                }
            },

            login: function() {
                const idJuri = document.getElementById('selJuri').value;
                const pin = document.getElementById('txtPin').value;

                if (!idJuri || !pin) return alert("Pilih Nama Juri dan isi PIN!");

                const juriObj = this.masterData.juri.find(j => j.ID_JURI === idJuri);
                if (juriObj && String(juriObj.PIN) === String(pin)) {
                    this.currentJuri = juriObj;
                    sessionStorage.setItem('juriSession', JSON.stringify(juriObj));
                    this.showDashboard();
                } else {
                    alert("PIN Salah! Silakan coba lagi.");
                }
            },

            checkSession: function() {
                const sess = sessionStorage.getItem('juriSession');
                if (sess) {
                    this.currentJuri = JSON.parse(sess);
                    this.showDashboard();
                }
            },

            showDashboard: function() {
                document.getElementById('secLogin').classList.add('hidden');
                document.getElementById('secForm').classList.remove('hidden');
                document.getElementById('navActions').classList.remove('hidden');

                document.getElementById('lblNamaJuri').innerText = this.currentJuri.NAMA_JURI;
                document.getElementById('lblPosJuri').innerText = this.currentJuri.KODE_POS;

                this.renderKontingenOptions();
                this.renderRubrikDinamis();
                this.resetTimer();
            },

            renderKontingenOptions: function() {
                const sel = document.getElementById('selKontingen');
                sel.innerHTML = '<option value="">-- Pilih Tim --</option>';
                if(this.masterData && this.masterData.kontingen) {
                    this.masterData.kontingen.forEach(k => {
                        sel.innerHTML += `<option value="${k.ID_KONTINGEN} - ${k.NAMA_TIM}">${k.ID_KONTINGEN} - ${k.NAMA_TIM} (${k.KECAMATAN})</option>`;
                    });
                }

                sel.onchange = (e) => {
                    this.resetTimer();
                    const selected = e.target.value;
                    if (!selected || !this.masterData.tracking) return;
                    
                    const posJuri = this.currentJuri.KODE_POS;
                    const trackItem = this.masterData.tracking.find(t => selected.includes(t.id_kontingen));

                    if (trackItem && trackItem.pos_sudah.includes(posJuri)) {
                        alert(`⚠️ PERINGATAN:\n\nTim ${selected} SUDAH PERNAH DINILAI di ${posJuri}!\n\nJika disimpan ulang, data nilai sebelumnya akan tertimpa di Google Sheets.`);
                    }
                };
            },

            renderRubrikDinamis: function() {
                const container = document.getElementById('containerRubrik');
                document.getElementById('lblKodePosRubrik').innerText = this.currentJuri.KODE_POS;
                container.innerHTML = '';

                if (!this.masterData.rubrik) {
                    container.innerHTML = '<p class="text-xs text-red-400">Data rubrik tidak ditemukan.</p>';
                    return;
                }

                const items = this.masterData.rubrik.filter(r => r.KODE_POS === this.currentJuri.KODE_POS);

                if (items.length === 0) {
                    container.innerHTML = '<p class="text-xs text-amber-400">Pos ini tidak memiliki rubrik khusus. Masukkan nilai langsung di bawah.</p>';
                    return;
                }

                items.forEach((item) => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700";
                    
                    let inputHtml = '';
                    // Jika rubrik memiliki opsi dropdown berlabel
                    if (item.OPTIONS) {
                        const opts = item.OPTIONS.split(',').map(o => o.trim());
                        const optionsHtml = opts.map(opt => {
                            let label = opt, val = opt;
                            if (opt.includes(':')) {
                                const parts = opt.split(':');
                                label = `${parts[0]} (${parts[1]} pt)`;
                                val = parts[1];
                            }
                            return `<option value="${val}">${label}</option>`;
                        }).join('');

                        inputHtml = `
                            <select data-item="${item.NAMA_ITEM}" 
                                    data-maks="${item.BOBOT_MAKS}" 
                                    onchange="app.hitungTotalAuto()" 
                                    class="input-rubrik bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs font-bold text-amber-400 focus:border-red-500 outline-none">
                                <option value="0">0 Poin</option>
                                ${optionsHtml}
                            </select>
                        `;
                    } else {
                        inputHtml = `
                            <input type="number" 
                                   min="0" 
                                   max="${item.BOBOT_MAKS}" 
                                   data-item="${item.NAMA_ITEM}" 
                                   data-maks="${item.BOBOT_MAKS}" 
                                   oninput="app.hitungTotalAuto()" 
                                   class="input-rubrik bg-slate-800 border border-slate-600 rounded-lg p-2 w-20 text-center font-bold text-amber-400 text-sm focus:border-red-500 outline-none" 
                                   placeholder="0">
                        `;
                    }

                    div.innerHTML = `
                        <div class="pr-2">
                            <span class="text-xs font-bold block text-slate-200">${item.NAMA_ITEM}</span>
                            <span class="text-[10px] text-slate-400 block">Maksimal: ${item.BOBOT_MAKS} Poin</span>
                        </div>
                        ${inputHtml}
                    `;
                    container.appendChild(div);
                });
            },

            hitungTotalAuto: function() {
                let total = 0;
                const inputs = document.querySelectorAll('.input-rubrik');
                inputs.forEach(input => {
                    let val = parseFloat(input.value) || 0;
                    let max = parseFloat(input.getAttribute('data-maks')) || 100;
                    if (val > max) {
                        val = max;
                        input.value = max;
                    }
                    total += val;
                });
                document.getElementById('lblTotalSkorAuto').innerText = total + " Poin";
            },

            // LOGIKA STOPWATCH TIMER
            startTimer: function() {
                if (this.timerRunning) return;
                this.timerRunning = true;
                document.getElementById('btnTimerStart').disabled = true;
                document.getElementById('btnTimerPause').disabled = false;
                document.getElementById('lblTimerBadge').className = 'bg-emerald-950 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full font-bold pulse-dot';
                document.getElementById('lblTimerBadge').innerText = 'Berjalan';

                this.timerInterval = setInterval(() => {
                    this.timerSeconds++;
                    this.updateTimerDisplay();
                }, 1000);
            },

            pauseTimer: function() {
                if (!this.timerRunning) return;
                this.timerRunning = false;
                clearInterval(this.timerInterval);
                document.getElementById('btnTimerStart').disabled = false;
                document.getElementById('btnTimerPause').disabled = true;
                document.getElementById('lblTimerBadge').className = 'bg-amber-950 text-amber-400 text-[10px] px-2 py-0.5 rounded-full font-bold';
                document.getElementById('lblTimerBadge').innerText = 'Dijeda';
            },

            resetTimer: function() {
                this.pauseTimer();
                this.timerSeconds = 0;
                this.updateTimerDisplay();
                document.getElementById('lblTimerBadge').className = 'bg-slate-900 text-slate-400 text-[10px] px-2 py-0.5 rounded-full font-bold';
                document.getElementById('lblTimerBadge').innerText = 'Standby';
            },

            updateTimerDisplay: function() {
                const mins = Math.floor(this.timerSeconds / 60).toString().padStart(2, '0');
                const secs = (this.timerSeconds % 60).toString().padStart(2, '0');
                document.getElementById('lblTimerDisplay').innerText = `${mins}:${secs}`;
                document.getElementById('txtDurasi').value = this.timerSeconds;
            },

            logout: function() {
                sessionStorage.clear();
                location.reload();
            },

            // DIRECT WEB BLUETOOTH PRINTER THERMAL
            connectBT: async function() {
                try {
                    const device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: [
                            '000018f0-0000-1000-8000-00805f9b34fb', 
                            '00001101-0000-1000-8000-00805f9b34fb',
                            '0000ff00-0000-1000-8000-00805f9b34fb'
                        ]
                    });
                    const server = await device.gatt.connect();
                    const services = await server.getPrimaryServices();

                    for (const service of services) {
                        const chars = await service.getCharacteristics();
                        for (const c of chars) {
                            if (c.properties.write || c.properties.writeWithoutResponse) {
                                this.btChar = c;
                                break;
                            }
                        }
                        if (this.btChar) break;
                    }

                    if (this.btChar) {
                        document.getElementById('lblBT').innerText = "Terhubung";
                        document.getElementById('btnBT').className = "bg-emerald-500 text-slate-900 px-2 py-1 rounded-lg text-xs font-black flex items-center shadow";
                        alert("✅ Printer Thermal RPP02N Berhasil Terhubung!");
                    }
                } catch (e) {
                    alert("Gagal menyambungkan Bluetooth: " + e.message);
                }
            },

            simpan: async function() {
                const kontingen = document.getElementById('selKontingen').value;
                const durasi = document.getElementById('txtDurasi').value;
                const catatan = document.getElementById('txtCatatan').value;

                if (!kontingen) return alert("Pilih Kontingen terlebih dahulu!");

                let rincianNilai = {};
                let totalSkor = 0;
                const inputs = document.querySelectorAll('.input-rubrik');
                
                inputs.forEach(input => {
                    const itemNama = input.getAttribute('data-item');
                    const itemNilai = parseFloat(input.value) || 0;
                    rincianNilai[itemNama] = itemNilai;
                    totalSkor += itemNilai;
                });

                const btn = document.getElementById('btnSimpan');
                btn.disabled = true;
                btn.innerText = "MENYIMPAN DATA...";

                const payload = {
                    nama_juri: this.currentJuri.NAMA_JURI,
                    pos_lomba: this.currentJuri.KODE_POS,
                    kontingen: kontingen,
                    total_skor: totalSkor,
                    durasi: durasi || "0",
                    catatan: catatan || "-",
                    rincian_nilai: rincianNilai,
                    timestamp: new Date().toLocaleString('id-ID')
                };

                // Simpan ke Cache Lokal untuk Riwayat & Reprint Struk
                this.simpanRiwayatLokal(payload);

                try {
                    const res = await fetch(GAS_API_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();

                    if (result.status === "SUCCESS") {
                        alert("✅ Data Nilai Berhasil Disimpan!");
                        await this.cetakStruk(payload);
                        
                        this.init(); // Refresh data tracking

                        // Reset Form
                        document.getElementById('selKontingen').value = '';
                        document.getElementById('txtCatatan').value = '';
                        inputs.forEach(inp => inp.value = '');
                        document.getElementById('lblTotalSkorAuto').innerText = "0 Poin";
                        this.resetTimer();
                    } else {
                        alert("Gagal simpan: " + result.message);
                    }
                } catch (e) {
                    alert("Tersimpan di offline history (Error jaringan): " + e.message);
                    await this.cetakStruk(payload);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i><span>SIMPAN & CETAK STRUK</span>`;
                }
            },

            // RIWAYAT LOKAL & CETAK ULANG
            simpanRiwayatLokal: function(data) {
                let list = JSON.parse(localStorage.getItem('sijum_history_v2')) || [];
                list.unshift(data);
                localStorage.setItem('sijum_history_v2', JSON.stringify(list));
                localStorage.setItem('sijum_last_print_v2', JSON.stringify(data));
            },

            cetakUlangTerakhir: async function() {
                const last = localStorage.getItem('sijum_last_print_v2');
                if (!last) return alert("Belum ada riwayat cetak struk terakhir.");
                await this.cetakStruk(JSON.parse(last));
            },

            bukaRiwayat: function() {
                const container = document.getElementById('listHistoryContainer');
                let list = JSON.parse(localStorage.getItem('sijum_history_v2')) || [];

                if
